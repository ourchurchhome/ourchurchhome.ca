version: 1

content_models:
  - name: churches
    path: src/content/churches/*.md
    label: "{{title}}"
    read: true
    create: false
    update: true
    delete: false
    fields:
      - name: title
        type: string
        required: true
      - name: address
        type: string
        required: true
      - name: serviceTime
        type: string
        required: true
      - name: description
        type: string
      - name: image
        type: string
        display: { component: media, media: public-images }

  - name: articles
    path: src/content/articles/*.md
    label: "{{title}}"
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: string
        required: true
        display: { component: date, description: "ISO date (YYYY-MM-DD)" }
      - name: category
        type: string
        required: true
        enum: [announcement, news, reflection, general]
        display: { component: select }
      - name: church
        type: string
        required: true
        enum: [morell, mount-stewart, st-peters-bay, all]
        display: { component: select }
      - name: description
        type: string
      - name: draft
        type: boolean
      - name: body
        label: Article
        type: string
        display: { component: "body", source: body, format: markdown, flavor: gfm }

  - name: banner
    path: src/content/banner.md
    create: false
    delete: false
    fields:
      - name: enabled
        type: boolean
      - name: link
        type: string
      - name: body
        label: Page
        type: string
        display: { component: "body", source: body, format: markdown, flavor: gfm }

  - name: schedules
    path: src/content/schedules/*.json
    # schedulesSchema has no `title` — entries are identified by church + type.
    label: "{{church}} — {{type}}"
    read: true
    create: false
    update: true
    delete: false
    fields:
      - name: church
        type: string
        required: true
        enum: [morell, mount-stewart, st-peters-bay]
        display: { component: select }
      - name: type
        type: string
        required: true
        enum: [cleaner, greeter, reader]
        display: { component: select }
      - name: entries
        type: array
        of: object
        display: { component: list }
        fields:
          - name: date
            type: string
            required: true
            display: { component: date, description: "ISO date (YYYY-MM-DD)" }
          - name: name
            type: string
            required: true

  - name: homepage
    path: src/content/homepage.json
    create: false
    delete: false
    fields:
      # Mirrors the `widgets` discriminated union in src/content/schemas.ts.
      # Variant names must equal the `type` literals there, and each variant's
      # fields must match that member's shape.
      #
      # NOTE: the mixedList control writes the chosen variant name to `_variant`
      # (hardcoded in @go-git-cms/design-system) rather than to `type`. The
      # homepage schema normalises `_variant` -> `type` on read so saves from
      # the editor still validate. Keep the variant order below in sync with
      # the schema: the first variant is what "Add item" creates.
      - name: widgets
        type: array
        of: object
        display: { component: mixedList }
        variants:
          - name: hero
            label: Hero
            fields:
              - name: title
                type: string
                required: true
              - name: subtitle
                type: string
              - name: image
                type: string
                display: { component: media, media: public-images }
              - name: buttons
                type: array
                of: object
                display: { component: list }
                fields:
                  - name: primary
                    type: boolean
                  - name: copy
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
          - name: news
            label: News & Updates
            fields:
              - name: title
                type: string
                required: true
              - name: subtitle
                type: string
          - name: vision
            label: Our Shared Vision
            fields:
              - name: title
                type: string
                required: true
              - name: body
                type: string
              - name: quote
                type: string
              - name: communityCount
                type: integer
              - name: yearsOfGrace
                type: string
              - name: ctaTitle
                type: string
              - name: ctaDescription
                type: string
          - name: churches
            label: Churches
            fields:
              - name: title
                type: string
                required: true
              - name: subtitle
                type: string

media:
  - name: public-images
    path: public/images/**/*
    public_base: /images
    mime_types:
      - image/jpeg
      - image/png
      - image/webp
      - image/avif
      - image/gif
