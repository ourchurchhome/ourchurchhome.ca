version: 1

content_models:
  - name: churches
    path: src/content/churches/*.md
    label: "{{title}}"
    read: true
    create: false
    update: true
    delete: false
    fields:
      - name: title
        type: string
        required: true
      - name: address
        type: string
        required: true
      - name: serviceTime
        type: string
        required: true
      - name: description
        type: string
      - name: image
        type: string
        display: { component: media, media: public-images }

  - name: articles
    path: src/content/articles/*.md
    label: "{{title}}"
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: string
        required: true
        display: { component: date, description: "ISO date (YYYY-MM-DD)" }
      - name: category
        type: string
        required: true
        enum: [announcement, news, reflection, general]
        display: { component: select }
      - name: church
        type: string
        required: true
        enum: [morell, mount-stewart, st-peters-bay, all]
        display: { component: select }
      - name: description
        type: string
      - name: draft
        type: boolean

  - name: banner
    path: src/content/banner.md
    create: false
    delete: false
    fields:
      - name: enabled
        type: boolean
      - name: link
        type: string

  - name: schedules
    path: src/content/schedules/*.json
    label: "{{title}}"
    read: true
    create: false
    update: true
    delete: false
    fields:
      - name: title
        type: string
        required: true
        display: { hidden: true }
      - name: church
        type: string
        required: true
        enum: [morell, mount-stewart, st-peters-bay]
      - name: type
        type: string
        required: true
        enum: [cleaner, greeter, reader]
        display: { component: select }
      - name: entries
        type: array
        of: object
        display: { component: list }
        fields:
          - name: date
            type: string
            required: true
            display: { component: date, description: "ISO date (YYYY-MM-DD)" }
          - name: name
            type: string
            required: true

  - name: homepage
    path: src/content/homepage.json
    create: false
    delete: false
    fields:
      - name: widgets
        type: array
        display: { component: mixedList }
        variants:
          - name: churches
            fields:
              - name: title
                type: string
                required: true
              - name: subtitle
                type: string
          - name: hero
            fields:
              - name: title
                type: string
                required: true
              - name: subtitle
                type: string
              - name: image
                type: string
                display: { component: media, media: public-images }
              - name: buttons
                type: array
                of: object
                fields:
                  - name: primary
                    type: boolean
                  - name: copy
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
          - name: news
            fields:
              - name: title
                type: string
                required: true
              - name: subtitle
                type: string
          - name: vision
            fields:
              - name: title
                type: string
                required: true
              - name: body
                type: string
              - name: quote
                type: string
              - name: communityCount
                type: integer
              - name: yearsOfGrace
                type: string
              - name: ctaTitle
                type: string
              - name: ctaDescription
                type: string

media:
  - name: public-images
    path: public/images/**/*
    public_base: /images
    mime_types:
      - image/jpeg
      - image/png
      - image/webp
      - image/avif
      - image/gif
